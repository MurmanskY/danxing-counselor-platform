name: danxing
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: danxing
      POSTGRES_USER: danxing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.py first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U danxing -d danxing"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init-env.py first}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run scripts/init-env.py first}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run scripts/init-env.py first}
    command: server /data --console-address ':9001'
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/danxing
      POSTGRES_USER: danxing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: danxing-private
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/init-env.py first}
      COUNSELOR_P001_USERNAME: ${COUNSELOR_P001_USERNAME:-}
      COUNSELOR_P001_PASSWORD: ${COUNSELOR_P001_PASSWORD:-}
      COUNSELOR_P002_USERNAME: ${COUNSELOR_P002_USERNAME:-}
      COUNSELOR_P002_PASSWORD: ${COUNSELOR_P002_PASSWORD:-}
      COUNSELOR_P003_USERNAME: ${COUNSELOR_P003_USERNAME:-}
      COUNSELOR_P003_PASSWORD: ${COUNSELOR_P003_PASSWORD:-}
      COUNSELOR_P004_USERNAME: ${COUNSELOR_P004_USERNAME:-}
      COUNSELOR_P004_PASSWORD: ${COUNSELOR_P004_PASSWORD:-}
      COUNSELOR_P005_USERNAME: ${COUNSELOR_P005_USERNAME:-}
      COUNSELOR_P005_PASSWORD: ${COUNSELOR_P005_PASSWORD:-}
      COUNSELOR_P006_USERNAME: ${COUNSELOR_P006_USERNAME:-}
      COUNSELOR_P006_PASSWORD: ${COUNSELOR_P006_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  minio-data:
